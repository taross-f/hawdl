name: Release

on:
  push:
    tags: ["v*"]
  # Verify the packaging path whenever the pieces it depends on change, so a
  # broken release workflow is caught on a PR instead of on a tag.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Package.swift
      - Sources/HawdlBar/Resources/Info.plist
      - Sources/HawdlCore/Version.swift
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: build and package
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      source-name: ${{ steps.source.outputs.name }}
      source-checksum: ${{ steps.source.outputs.checksum }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      # The binaries report hawdlVersion, and Info.plist carries its own copy.
      # A tag that disagrees with either would ship a build that lies about
      # what it is, so refuse to release one.
      - name: Resolve and check the version
        id: version
        run: |
          set -euo pipefail
          source_version="$(sed -n 's/^public let hawdlVersion = "\(.*\)"$/\1/p' Sources/HawdlCore/Version.swift)"
          if [ -z "$source_version" ]; then
            echo "::error::could not read hawdlVersion from Sources/HawdlCore/Version.swift"
            exit 1
          fi
          echo "version=$source_version" >> "$GITHUB_OUTPUT"
          echo "hawdlVersion = $source_version"

          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            Sources/HawdlBar/Resources/Info.plist)"
          if [ "$plist_version" != "$source_version" ]; then
            echo "::error::Info.plist CFBundleShortVersionString ($plist_version) != hawdlVersion ($source_version)"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$source_version" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match hawdlVersion $source_version"
              exit 1
            fi
          fi

      # Universal so one artifact covers both Apple Silicon and Intel.
      - name: Build (release, universal)
        id: build
        run: |
          set -euo pipefail
          swift build -c release --disable-sandbox --arch arm64 --arch x86_64
          bin="$(swift build -c release --disable-sandbox --arch arm64 --arch x86_64 --show-bin-path)"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "binaries in $bin"

      - name: Verify every binary is universal
        run: |
          set -euo pipefail
          bin="${{ steps.build.outputs.bin }}"
          for exe in hawdl hawdld HawdlBar; do
            lipo -info "$bin/$exe"
            lipo -archs "$bin/$exe" | grep -qw arm64
            lipo -archs "$bin/$exe" | grep -qw x86_64
          done

      - name: Smoke test the binaries
        run: |
          set -euo pipefail
          bin="${{ steps.build.outputs.bin }}"
          "$bin/hawdl" --version
          "$bin/hawdld" --version
          "$bin/hawdl" --help > /dev/null

      - name: Assemble the tarball
        id: package
        run: |
          set -euo pipefail
          bin="${{ steps.build.outputs.bin }}"
          version="${{ steps.version.outputs.version }}"
          name="hawdl-$version-macos-universal"
          stage="dist/$name"

          mkdir -p "$stage/HawdlBar.app/Contents/MacOS"
          cp "$bin/hawdl" "$bin/hawdld" "$stage/"
          cp "$bin/HawdlBar" "$stage/HawdlBar.app/Contents/MacOS/"
          cp Sources/HawdlBar/Resources/Info.plist "$stage/HawdlBar.app/Contents/"
          cp LICENSE README.md README.ja.md "$stage/"
          cp .github/release-assets/INSTALL.md "$stage/"

          # swift build ad-hoc signs the bare executable. Dropping it into a
          # bundle and adding Info.plist changes the bundle after that
          # signature, which macOS refuses to launch. Re-sign the assembled
          # bundle, or the app silently fails to appear in the menu bar.
          codesign --force --deep --sign - "$stage/HawdlBar.app"

          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "$stage"

          checksum="$(shasum -a 256 "dist/$name.tar.gz" | cut -d' ' -f1)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "$checksum  $name.tar.gz"

      # Unpack what we just built and run it, so a broken bundle or a missing
      # file fails here rather than on a user's machine.
      - name: Verify the tarball
        run: |
          set -euo pipefail
          name="${{ steps.package.outputs.name }}"
          work="$(mktemp -d)"
          tar -C "$work" -xzf "dist/$name.tar.gz"
          root="$work/$name"

          test -x "$root/hawdl"
          test -x "$root/hawdld"
          test -x "$root/HawdlBar.app/Contents/MacOS/HawdlBar"
          test -f "$root/HawdlBar.app/Contents/Info.plist"
          test -f "$root/INSTALL.md"
          test -f "$root/LICENSE"

          # A bundle whose signature does not cover its current contents will
          # not launch, and the failure is silent: no menu bar item, no error.
          codesign --verify --deep --strict "$root/HawdlBar.app"

          "$root/hawdl" --version
          # LSUIElement must survive into the shipped bundle, or the menu bar
          # app takes over the Dock and the menu bar on first launch.
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$root/HawdlBar.app/Contents/Info.plist" | grep -qi true

          sock=/tmp/hawdl-release-check.sock
          state=/tmp/hawdl-release-check.json
          "$root/hawdld" --dry-run --socket "$sock" --state "$state" &
          daemon=$!
          trap 'kill $daemon 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if [ -S "$sock" ]; then break; fi
            sleep 0.1
          done
          test -S "$sock"
          "$root/hawdl" hold --socket "$sock" --json | grep -q '"desired":"hold"'
          kill -TERM $daemon
          wait $daemon || true

      # `brew install` fetches this, not the source archive GitHub generates
      # for a tag. Only uploaded assets carry a download_count, so every
      # install is invisible unless the formula points at a file we published
      # ourselves. It also pins the formula's sha256 to a tarball we produce,
      # rather than one GitHub regenerates on demand.
      - name: Assemble the source tarball
        id: source
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          name="hawdl-$version-src"
          mkdir -p dist

          # -n keeps the timestamp out of the gzip header, so the same commit
          # always hashes to the same value.
          git archive --format=tar --prefix="$name/" HEAD | gzip -n > "dist/$name.tar.gz"

          checksum="$(shasum -a 256 "dist/$name.tar.gz" | cut -d' ' -f1)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "$checksum  $name.tar.gz"

      # The formula builds from this tarball, so a file missing from it is a
      # broken `brew install`. Check for the ones the formula names.
      - name: Verify the source tarball
        run: |
          set -euo pipefail
          name="${{ steps.source.outputs.name }}"
          version="${{ steps.version.outputs.version }}"
          work="$(mktemp -d)"
          tar -C "$work" -xzf "dist/$name.tar.gz"
          root="$work/$name"

          test -f "$root/Package.swift"
          test -f "$root/LICENSE"
          test -d "$root/Tests"
          # Installed into the assembled .app bundle by the formula.
          test -f "$root/Sources/HawdlBar/Resources/Info.plist"
          grep -q "\"$version\"" "$root/Sources/HawdlCore/Version.swift"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Write the release notes
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          name="${{ steps.package.outputs.name }}"
          source_name="${{ steps.source.outputs.name }}"

          {
            echo "Universal build (Apple Silicon and Intel) of \`hawdl\`, \`hawdld\` and \`HawdlBar.app\`."
            echo
            echo "### Install"
            echo
            echo "From the tap, which builds this release from source:"
            echo
            echo '```sh'
            echo "brew install taross-f/hawdl/hawdl"
            echo '```'
            echo
            echo "Or from the prebuilt tarball below:"
            echo
            echo '```sh'
            echo "tar xzf $name.tar.gz"
            echo "cd $name"
            echo '```'
            echo
            echo "**This build is unsigned and not notarized.** macOS quarantines anything"
            echo "downloaded from a browser, so clear the attribute before first run:"
            echo
            echo '```sh'
            echo "xattr -dr com.apple.quarantine ."
            echo '```'
            echo
            echo "Then follow \`INSTALL.md\` in the tarball."
            echo
            echo "### Checksums"
            echo
            echo '```'
            echo "${{ steps.package.outputs.checksum }}  $name.tar.gz"
            echo "${{ steps.source.outputs.checksum }}  $source_name.tar.gz"
            echo '```'
            echo
            echo "The formula's stable stanza, which the Release workflow writes into"
            echo "taross-f/homebrew-hawdl on its own:"
            echo
            echo '```ruby'
            echo "url \"https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$source_name.tar.gz\""
            echo "sha256 \"${{ steps.source.outputs.checksum }}\""
            echo '```'
            echo
            echo "### Reminder"
            echo
            echo "Holding AWDL down disables AirDrop, Handoff, Sidecar, Universal Control"
            echo "and Continuity Camera. \`hawdl release\` puts it back."
          } > release-notes.md

          cat release-notes.md

      - name: Create the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            dist/*.tar.gz

  # The formula lives in taross-f/homebrew-hawdl so there is only one copy of
  # it, which means a tag here has to reach across and update it there. Doing
  # it by hand is what leaves a tap pointing at a version that no longer
  # exists, and the checksum cannot be known before this run anyway.
  bump-tap:
    name: bump the tap formula
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # GITHUB_TOKEN is scoped to this repository, so pushing to the tap needs
      # a PAT with contents write on taross-f/homebrew-hawdl. Without it the
      # release still stands; only the tap is left behind, so warn rather than
      # fail and leave a published release looking broken.
      - name: Check for the tap token
        id: token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TAP_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; update Formula/hawdl.rb by hand with the stanza in the release notes"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          repository: taross-f/homebrew-hawdl
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Rewrite the stable stanza
        if: steps.token.outputs.present == 'true'
        env:
          VERSION: ${{ needs.package.outputs.version }}
          TAG: ${{ github.ref_name }}
          SOURCE_NAME: ${{ needs.package.outputs.source-name }}
          CHECKSUM: ${{ needs.package.outputs.source-checksum }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib

          version = os.environ["VERSION"]
          url = (
              "https://github.com/taross-f/hawdl/releases/download/"
              f"{os.environ['TAG']}/{os.environ['SOURCE_NAME']}.tar.gz"
          )

          path = pathlib.Path("tap/Formula/hawdl.rb")
          formula = path.read_text()

          # The markers are what makes this rewrite safe: without them the
          # obvious regex would also match the head stanza's url.
          begin, end = "  # stable:begin\n", "  # stable:end\n"
          start = formula.index(begin) + len(begin)
          stop = formula.index(end)

          # An explicit version: Homebrew would otherwise read "0.1.0-src" off
          # the asset's filename.
          stanza = (
              f'  url "{url}"\n'
              f'  version "{version}"\n'
              f'  sha256 "{os.environ["CHECKSUM"]}"\n'
          )
          if formula[start:stop] == stanza:
              print("formula already current")
          else:
              path.write_text(formula[:start] + stanza + formula[stop:])
              print(stanza)
          PY

      - name: Commit and push
        if: steps.token.outputs.present == 'true'
        working-directory: tap
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/hawdl.rb
          git commit -m "hawdl ${{ needs.package.outputs.version }}"
          git push
